[project]
name = "sahyog-care-companion"
version = "0.1.0"
description = "Agentic patient and doctor assistant for a fictional hospital network (FDE Academy engagement)"
readme = "README.md"
# Dependency set resolved on Python 3.12 on 24 Oct 2026 (uv pip compile).
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.1",
  "redis==8.1.0",
  "rq==2.12.0",
  # ragas 0.4.3 depends on instructor, which needs openai < 3; 2.54.0 is the newest 2.x.
  "openai==2.54.0",
  "langsmith==0.14.12",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "sentence-transformers==6.2.0",
  "pypdf==6.21.2",
  "ragas==0.4.3",
  "python-dotenv==1.2.4",
  # Data estate (PR #3). Newest releases older than the 22 Oct 2026 drops; set re-resolved on 3.12.
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "kaggle==2.2.4",
  # Synthetic layer (PR #4)
  "fpdf2==2.8.9",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["data/transforms/tests", "data/synthetic/tests", "services", "evals"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Not a library: install dependencies only. The flat repo layout otherwise breaks
# setuptools auto-discovery (several top-level folders).
[tool.setuptools]
packages = []
