# One command starts the stack:  docker compose -f infra/docker-compose.yml up -d --build
#   postgres + pgvector, redis, the API on :8000 and the ingest worker.
# Image tags checked on 24 Oct 2026 against the pgvector README and Docker's
# official-images list for redis. The api and worker share one image (../Dockerfile).
# data/ is mounted, so processed data, the synthetic PDFs, the embedding cache and uploads are shared with the host.
name: sahyog

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahyog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-sahyog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahyog} -d ${POSTGRES_DB:-sahyog}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: Dockerfile }
    env_file: ../.env
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-sahyog}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-sahyog}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes: &app_volumes
      - ../data:/app/data
      - models:/models
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: Dockerfile }
    command: ["rq", "worker", "ingest", "--url", "redis://redis:6379/0"]
    env_file: ../.env
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  models:     # BGE-M3 (about 2.3 GB) downloads here on first use and stays
